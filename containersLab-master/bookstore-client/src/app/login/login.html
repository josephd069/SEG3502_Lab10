<div class="login-panel">

  <div class="page-intro">

    <p class="eyebrow">Espace utilisateur</p>

    <h2>Connexion</h2>

    <p>
      Connectez-vous pour accéder à l'administration
      de la bibliothèque.
    </p>

  </div>

  @if (message) {

    <div class="alert alert-danger" role="alert">
      {{ message }}
    </div>

  }

  @if (isLoggedIn) {

    <div class="alert alert-success">

      Vous êtes connecté en tant que
      <strong>{{ loggedUser }}</strong>.

    </div>

    <button
      type="button"
      (click)="logout()"
      class="btn btn-danger">

      Se déconnecter

    </button>

  }

  @else {

    <div class="mb-3">

      <label for="username" class="form-label">
        Nom d'utilisateur
      </label>

      <input
        type="text"
        name="username"
        id="username"
        [(ngModel)]="username"
        placeholder="Votre nom d'utilisateur"
        class="form-control">

    </div>

    <div class="mb-3">

      <label for="password" class="form-label">
        Mot de passe
      </label>

      <input
        type="password"
        name="password"
        id="password"
        [(ngModel)]="password"
        placeholder="Votre mot de passe"
        class="form-control">

    </div>

    <button
      type="button"
      (click)="checkLogin()"
      class="btn btn-success">

      Se connecter

    </button>

  }

</div>
